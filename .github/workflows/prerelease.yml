name: Build Windows prerelease

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025-vs2026
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Configure read-only recovery probe
        run: |
          cmake -S . -B build-ci -G "Visual Studio 18 2026" -A x64 -DRS2_RECOVERY_GUARD_PROBE=ON
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed' }
      - name: Build DLLs, tools and independent tests
        run: |
          cmake --build build-ci --config Release --parallel 4 --target rs2_x3daudio_bootstrap rs2_server_fix_companion_active rs2_server_fix_companion_reporting rs2_pe_contract rs2_runtime_inventory rs2_deployment_preflight rs2_recon_tests rs2_observer_tests
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - name: Run public CI checks
        shell: powershell
        run: |
          # CTest starts powershell.exe fixtures. Do not inherit PowerShell 7's
          # module search paths, which can hide the Windows Security cmdlets.
          $env:PSModulePath = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\Modules;$env:ProgramFiles\WindowsPowerShell\Modules"
          Import-Module Microsoft.PowerShell.Security -ErrorAction Stop
          Get-Command Get-FileHash, Set-Acl -ErrorAction Stop | Out-Null
          ctest --test-dir build-ci -C Release -R '^(pe_bootstrap_contract|pe_active_companion_contract|pe_reporting_companion_contract|recon_transaction|observer_core|reporting_collector|recovery_control_helper)$' --no-tests=error --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Public CI checks failed' }
      - name: Package recon and guard-probe separately
        shell: powershell
        run: |
          ./tools/Package-Prerelease.ps1 -BuildDirectory "$PWD/build-ci" -OutputDirectory "$env:RUNNER_TEMP/rs2-dist" -Commit $env:GITHUB_SHA -RunUrl "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-prerelease
          path: ${{ runner.temp }}/rs2-dist/*
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-prerelease
          path: dist
      - name: Publish commit-bound prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
          BUILD_TAG: build-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check SHA256SUMS
          gh release create "$BUILD_TAG" ./*.zip SHA256SUMS \
            --target "$SOURCE_COMMIT" --title "Windows CI build ${SOURCE_COMMIT:0:12}" \
            --notes-file release-notes.md --draft --prerelease --latest=false
          gh release edit "$BUILD_TAG" --draft=false --prerelease --latest=false
